<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f2eee5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ピクニッキング・セッション</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+Antique:wght@400;500&display=swap">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <nav class="bar" aria-label="画面">
    <div class="tabs" id="tabs">
      <button type="button" data-t="0" aria-current="true">録る</button>
      <button type="button" data-t="1">聴く</button>
      <i class="ul" id="ul"></i>
    </div>
    <button type="button" class="who" id="who" aria-label="ユーザーネームを変える"></button>
  </nav>

  <div class="pager" id="pager">
    <section class="pane" id="p0" aria-label="録る">
      <div class="in">
        <div class="stage" id="stage">
          <header class="head" id="head">
            <span>ピクニッキング</span>
            <span>セッション</span>
            <span>11.22 取手</span>
          </header>
          <div class="orb" data-i="0" data-state="empty"><button class="main" type="button"><span class="n">1</span><span class="t"></span></button><div class="foot"><button class="redo" type="button" hidden>取り直す</button><button class="lowcut" type="button" hidden aria-pressed="false">ローカット</button></div></div>
          <div class="orb" data-i="1" data-state="empty"><button class="main" type="button"><span class="n">2</span><span class="t"></span></button><div class="foot"><button class="redo" type="button" hidden>取り直す</button><button class="lowcut" type="button" hidden aria-pressed="false">ローカット</button></div></div>
          <div class="orb" data-i="2" data-state="empty"><button class="main" type="button"><span class="n">3</span><span class="t"></span></button><div class="foot"><button class="redo" type="button" hidden>取り直す</button><button class="lowcut" type="button" hidden aria-pressed="false">ローカット</button></div></div>
          <div class="orb" data-i="3" data-state="empty"><button class="main" type="button"><span class="n">4</span><span class="t"></span></button><div class="foot"><button class="redo" type="button" hidden>取り直す</button><button class="lowcut" type="button" hidden aria-pressed="false">ローカット</button></div></div>
          <div class="orb" data-i="4" data-state="empty"><button class="main" type="button"><span class="n">5</span><span class="t"></span></button><div class="foot"><button class="redo" type="button" hidden>取り直す</button><button class="lowcut" type="button" hidden aria-pressed="false">ローカット</button></div></div>
        </div>
        <p class="msg" id="msg" role="status" aria-live="polite"></p>
        <section class="ctl" aria-label="残響・音程">
          <div class="row"><label for="space">残響</label><input id="space" type="range" min="0" max="100" step="1" value="0"></div>
          <div class="row"><label for="pitch">音程</label><input id="pitch" type="range" min="-12" max="12" step="1" value="0"></div>
        </section>
      </div>
    </section>

    <section class="pane" id="p1" aria-label="聴く">
      <div class="in">
        <p class="net" id="net"></p>
        <div id="feed" class="feed"></div>
        <p class="empty" id="empty">まだ投稿がありません。<br>録音すると、ここに並びます。</p>
      </div>
    </section>
  </div>
</div>

<div class="gate" id="gate" hidden>
  <form class="gate-in" id="gateForm" autocomplete="off">
    <p class="gate-t">ピクニッキング<br>セッション</p>
    <label for="nameIn">ユーザーネーム</label>
    <input id="nameIn" type="text" maxlength="12" enterkeyhint="done" autocapitalize="off" autocorrect="off" spellcheck="false">
    <p class="gate-h">ほかの参加者に表示されます（12文字まで）</p>
    <div class="gate-b">
      <button type="submit" class="go">はじめる</button>
      <button type="button" class="cancel" id="gateCancel" hidden>もどる</button>
    </div>
  </form>
</div>

<script src="vendor/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
